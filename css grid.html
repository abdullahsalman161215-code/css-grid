<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css</title>
    <style>
        .grid-item1 {
            grid-area: header;
        }

        .grid-item2 {
            grid-area: menu;
        }

        .grid-item3 {
            grid-area: main;
        }

        .grid-item4 {
            grid-area: footer;
        }

        .grid-contaner {
            display: grid;
            grid-template-columns: auto auto auto auto auto;
        }
    </style>
</head>

<body>
    <div class="grid-contaner">
        <div class="grid-item1">header</div>
        <div class="grid-item2">menu</div>
        <div class="grid-item3">main</div>
        <div class="grid-item4">footer</div>
    </div>

</body>

</html>
